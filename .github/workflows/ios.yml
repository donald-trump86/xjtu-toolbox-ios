name: iOS validation

on:
  workflow_dispatch:
    inputs:
      package_unsigned_ipa:
        description: Build a device IPA for SideStore re-signing
        type: boolean
        default: false
  pull_request:
    paths:
      - 'iosApp/**'
      - 'iosShared/**'
      - 'shared/**'
      - 'feature/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - 'artwork/app-icon-master.png'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-validation:
    # Official Xcode 27 arm64 image; currently a public preview.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare XcodeGen and show the toolchain
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          java -version
          sh scripts/gradle-ios.sh --version
      - name: Select installed iPhone and iPad simulators
        id: simulators
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          devices = [d for group in data['devices'].values() for d in group if d.get('isAvailable')]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for kind in ('iPhone', 'iPad'):
                  matches = [d for d in devices if d['name'].startswith(kind)]
                  if not matches:
                      raise SystemExit('No installed ' + kind + ' simulator on this image')
                  matches.sort(key=lambda d: ('Duo' in d['name'], 'Pro' not in d['name'], d['name']))
                  print(kind.lower() + '=' + matches[0]['udid'], file=output)
          PY
      - name: Build both Apple frameworks and run Native tests
        run: >-
          sh scripts/gradle-ios.sh
          :iosShared:linkDebugFrameworkIosSimulatorArm64
          :iosShared:linkReleaseFrameworkIosArm64
          :shared:campus:iosSimulatorArm64Test
          :shared:model:iosSimulatorArm64Test
          :shared:navigation:iosSimulatorArm64Test
          :shared:designsystem:iosSimulatorArm64Test
          :feature:account:iosSimulatorArm64Test
          :feature:home:iosSimulatorArm64Test
          :feature:schedule:iosSimulatorArm64Test
          :feature:score:iosSimulatorArm64Test
          :feature:settings:iosSimulatorArm64Test
          -PiosSimulatorDevice=${{ steps.simulators.outputs.iphone }}
          --console=plain --max-workers=2
      - name: Test iPhone UI and app-hosted Keychain
        run: sh scripts/test-ios-simulator.sh '${{ steps.simulators.outputs.iphone }}'
      - name: Test iPad UI and app-hosted Keychain
        run: sh scripts/test-ios-simulator.sh '${{ steps.simulators.outputs.ipad }}'
      - name: Build device host without signing
        run: >-
          xcodebuild -project iosApp/XJTUToolbox.xcodeproj -scheme XJTUToolbox
          -configuration Debug -destination 'generic/platform=iOS'
          -derivedDataPath build/ios/DeviceDerivedData
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package device IPA on request
        if: github.event_name == 'workflow_dispatch' && inputs.package_unsigned_ipa
        run: sh scripts/build-ios-ipa.sh unsigned
      - name: Save build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation
          retention-days: 7
          if-no-files-found: warn
          path: |
            iosShared/build/bin/iosArm64/releaseFramework/
            iosShared/build/bin/iosSimulatorArm64/debugFramework/
            shared/*/build/reports/tests/
            shared/*/build/test-results/
            feature/*/build/reports/tests/
            feature/*/build/test-results/
            build/ios/*.xcresult
            build/ios/XJTUToolbox-unsigned.ipa
            build/ios/XJTUToolbox-unsigned.ipa.sha256
            build/ios/device-platform.txt

# Real-device signing stays local: scripts/build-ios-ipa.sh signed.
# Simulator tests use an ad-hoc identity; CI stores no private signing material.
